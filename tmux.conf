set -g default-shell /bin/bash
set -g default-command "bash -l"

# ==========================================
# General
# ==========================================

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:Tc"

set -g mouse on
set -s set-clipboard on

set -g history-limit 100000
set -sg escape-time 10

# Shipyard controls pipeline window names.
set -g automatic-rename off
set -g allow-rename off

set -g focus-events on


# ==========================================
# Window / Pane Behavior
# ==========================================

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# A new window starts another pipeline in the current directory.
bind c new-window -c "#{pane_current_path}"


# ==========================================
# Shipyard Status Bar
# ==========================================

set -g status on
set -g status-position top
set -g status-interval 2
set -g status-justify left

set -g status-left-length 30
set -g status-right-length 80

# Session = project.
set -g status-left " #[bold]#S "

# Window = pipeline.
# @pipeline_badge may contain tmux formatting.
set -g window-status-format \
    " #I:#{?@pipeline_badge,#{E:@pipeline_badge} ,}#W "

set -g window-status-current-format \
    " #[bold][#I:#{?@pipeline_badge,#{E:@pipeline_badge} ,}#W] "

set -g window-status-separator ""

# Active pane Git status and current time.
set -g status-right "#(cd #{q:pane_current_path} && branch=$(git branch --show-current 2>/dev/null) && [ -n \"$branch\" ] && printf ' %s ' \"$branch\")#(cd #{q:pane_current_path} && if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then if [ -n \"$(git status --porcelain 2>/dev/null)\" ]; then printf '✗ '; else printf '✓ '; fi; fi)%H:%M "


# ==========================================
# Pane Appearance
# ==========================================

set -g display-panes-time 1500

# Pane = tool.
# Pane title = repository and branch.
set -g pane-border-status top
set -g pane-border-format \
    " #P │ #{pane_current_command} │ #{pane_title} "

set -g pane-active-border-style fg=colour39
set -g pane-border-style fg=colour238


# ==========================================
# Navigation
# ==========================================

# Move between tools.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Move between pipelines.
bind -n S-Left previous-window
bind -n S-Right next-window

# Protect the current window as the project's command center.
bind C set-window-option -w @shipyard_role command \
    \; rename-window command \
    \; display-message "Window designated as command center"

# Return the current window to branch-based pipeline naming.
bind P set-window-option -wu @shipyard_role \
    \; run-shell "~/.config/shipyard/bin/forge clear >/dev/null 2>&1 || true" \
    \; display-message "Automatic pipeline naming enabled"
